name: Update GeM bid dashboard

on:
  schedule:
    # 04:00 UTC = 09:30 IST. GitHub cron is always UTC.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gem-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # no pip install: the scraper uses only the standard library

      # Proves whether GitHub's IP can reach GeM at all, before the real run.
      - name: Check GeM reachability
        run: |
          python - <<'EOF'
          import urllib.request, re, sys
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36")
          req = urllib.request.Request("https://bidplus.gem.gov.in/all-bids",
                                       headers={"User-Agent": UA})
          try:
              r = urllib.request.urlopen(req, timeout=40)
              body = r.read().decode("utf8", "ignore")
              tok = re.search(r"csrf_bd_gem_nk'\s*:\s*'([a-f0-9]+)'", body)
              print("HTTP", r.status, "|", len(body), "bytes | CSRF token:",
                    "FOUND" if tok else "MISSING")
              if not tok:
                  low = body.lower()
                  for w in ("captcha", "access denied", "forbidden", "blocked"):
                      if w in low:
                          print("  page mentions:", w)
                  print("  first 300 chars:", body[:300].replace("\n", " "))
                  sys.exit("GeM did not return a usable page from this runner.")
          except Exception as e:
              sys.exit("Cannot reach GeM: {}: {}".format(type(e).__name__, e))
          EOF

      - name: Scrape GeM
        run: |
          python gem_bids_scraper.py "laptop" "notebook"
          python gem_bids_scraper.py "desktop computer"
          python gem_bids_scraper.py "server" "all in one pc"
          python gem_bids_scraper.py "workstation"

      - name: Build dashboard
        run: |
          python build_dashboard.py
          mkdir -p _site
          cp dashboard.html _site/index.html
          cp bids.csv _site/bids.csv

      # Committing bids.csv preserves history between runs and keeps the repo
      # active, so GitHub does not disable the schedule after 60 days.
      - name: Commit updated data
        run: |
          git config user.name  "gem-bot"
          git config user.email "gem-bot@users.noreply.github.com"
          git add bids.csv bids.json
          git diff --staged --quiet || git commit -m "data: $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
